<form id="form-establishment" hx-post="{% url 'establishment:save_infos' %}" hx-target="#form-establishment" hx-swap="innerHTML">
  {% csrf_token %}
  <div class="card">
    <div class="card-title">Dados do Negócio</div>
    <div class="card-sub">Identificação pública da sua empresa</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="est-nome">Nome da empresa</label>
        <input value="{{ establishment.name }}" maxlength="30" type="text" id="est-nome" name="name" placeholder="Ex: Salão Beleza"/>
      </div>
      
      <div class="form-group">
        <label for="est-tel">Telefone / WhatsApp</label>
        <input value="{{ establishment.phone }}" maxlength="15" type="tel" id="est-tel" oninput="maskTelefone(this); checkConfirm()" name="phone" placeholder="(99) 99999-9999"/>
      </div>
      <button type="submit" class="btn-primary btn-save-establishment">
        <i class="fa-solid"></i> Salvar
      </button>
    </div>
  </div>
</form>
{% if msg %}
    <script>
        showToast("{{ msg }}", "{{ type }}");
    </script>
{% endif %}
