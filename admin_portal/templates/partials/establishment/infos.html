<form id="form-establishment" hx-post="{% url 'establishment:save_infos' %}" hx-target="#form-establishment" hx-swap="innerHTML">
  {% csrf_token %}
  <div class="card">
    <div class="card-title">Dados do Negócio</div>
    <div class="card-sub">Identificação pública da sua empresa</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="est-nome">Nome da empresa</label>
        <input value="{% if form %}{{ form.name.value|default:'' }}{% else %}{{ establishment.name|default:'' }}{% endif %}" maxlength="30" type="text" id="est-nome" name="name" placeholder="Ex: Salão Beleza"/>
        {% if form.name.errors %}
          {% for error in form.name.errors %}
            <span class="field-error">{{ error }}</span>
          {% endfor %}
        {% endif %}
      </div>
      
      <div class="form-group">
        <label for="est-tel">Telefone / WhatsApp</label>
        <input value="{% if form %}{{ form.phone.value|default:'' }}{% else %}{{ establishment.phone|default:'' }}{% endif %}" maxlength="15" type="tel" id="est-tel" oninput="maskTelefone(this)" name="phone" placeholder="(99) 99999-9999"/>
        {% if form.phone.errors %}
          {% for error in form.phone.errors %}
            <span class="field-error">{{ error }}</span>
          {% endfor %}
        {% endif %}
      </div>
      <button type="submit" class="btn-primary btn-save-establishment">
        <i class="fa-solid"></i> Salvar
      </button>
    </div>
  </div>
</form>
